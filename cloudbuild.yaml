# Email Manager Cloud Build Configuration

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/email-manager:$BUILD_ID', '.']
    
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/email-manager:$BUILD_ID']

  # Deploy container image to Cloud Run (without public access)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'email-manager'
    - '--image=gcr.io/$PROJECT_ID/email-manager:$BUILD_ID'
    - '--region=us-west2'
    - '--platform=managed'
    - '--memory=2Gi'
    - '--cpu=2'
    - '--timeout=300s'
    - '--set-env-vars=PYTHONUNBUFFERED=1,DEBUG=false'
    - '--port=8080'
    - '--concurrency=80'
    - '--min-instances=0'
    - '--max-instances=10'
    
  # Make the service publicly accessible with a separate command
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'beta'
    - 'run'
    - 'services'
    - 'add-iam-policy-binding'
    - 'email-manager'
    - '--region=us-west2'
    - '--member=allUsers'
    - '--role=roles/run.invoker'

# Store images in Container Registry
images:
- 'gcr.io/$PROJECT_ID/email-manager:$COMMIT_SHA'

# Timeout for the entire build process
timeout: '1800s'

options:
  logging: CLOUD_LOGGING_ONLY
